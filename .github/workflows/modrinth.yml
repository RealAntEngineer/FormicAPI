name: Publish to Modrinth

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel on Modrinth'
        type: choice
        options: [release, beta, alpha]
        default: release
      changelog:
        description: 'Changelog (Markdown)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  modrinth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          MC=$(grep -E '^minecraft_version\s*=' gradle.properties \
               | sed 's/.*=\s*//' | tr -d '[:space:]')
          MOD=$(grep -E '^mod_version\s*=' gradle.properties \
                | sed 's/.*=\s*//' | tr -d '[:space:]')
          echo "mc=$MC"   >> "$GITHUB_OUTPUT"
          echo "mod=$MOD" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      # Only the compiled mod JAR: skip -sources / -javadoc / -dev
      - name: Locate mod JAR
        id: jar
        run: |
          JARS=$(find build/libs -maxdepth 1 -name '*.jar' \
                   ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar')
          COUNT=$(echo "$JARS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 JAR in build/libs, found $COUNT"
            ls -l build/libs
            exit 1
          fi
          echo "path=$JARS" >> "$GITHUB_OUTPUT"

      # Typed changelog wins; otherwise release notes for this tag;
      # otherwise the latest release; otherwise empty. Never fails.
      - name: Resolve changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.versions.outputs.mc }}-${{ steps.versions.outputs.mod }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -n "$INPUT_CHANGELOG" ]; then
            BODY="$INPUT_CHANGELOG"
          elif BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null); then
            echo "Using release notes from $TAG"
          else
            echo "No release for $TAG, falling back to latest release"
            BODY=$(gh release view --json body --jq .body 2>/dev/null || true)
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$BODY"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: ${{ steps.versions.outputs.mod }} (MC ${{ steps.versions.outputs.mc }})
          version: ${{ steps.versions.outputs.mod }}
          channel: ${{ inputs.channel }}
          changelog: ${{ steps.changelog.outputs.body }}
          loaders: neoforge
          game-versions: ${{ steps.versions.outputs.mc }}
          files: ${{ steps.jar.outputs.path }}
          # Uncomment if your mod needs Fabric API (replace with the real project ID):
          # dependencies: |-
          #   [{ "project_id": "P7dR8mSH", "dependency_type": "required" }]